[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-box"
version = "1.0.0"
description = "Universal Package Manager, Encrypted Secret Vault & Sandboxed Runtime for Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ahmed Hassan"}
]
keywords = [
    "model-context-protocol",
    "mcp",
    "package-manager",
    "secrets-vault",
    "claude-desktop",
    "cursor",
    "windsurf",
    "developer-tools"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
mcp-box = "mcp_box.cli:main"
